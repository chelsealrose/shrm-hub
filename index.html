<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cleveland SHRM — Event Planning Tool</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#185FA5;--blue-light:#E6F1FB;--blue-mid:#B5D4F4;--blue-dark:#0C447C;
  --green:#3B6D11;--green-light:#EAF3DE;
  --amber:#EF9F27;--amber-light:#FAEEDA;--amber-dark:#854F0B;
  --red:#E24B4A;--red-light:#FCEBEB;--red-dark:#A32D2D;
  --border:#e2e2e2;--border-strong:#c8c8c8;
  --bg:#fff;--bg2:#f7f7f5;--text:#1a1a1a;--text2:#6b6b6b;
  --r-md:8px;--r-lg:12px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f2f5;color:var(--text);padding:20px 12px 60px;min-height:100vh}
.w{max-width:680px;margin:0 auto}
h2{font-size:18px;font-weight:600;margin-bottom:4px}
.sub{font-size:13px;color:var(--text2);margin-bottom:1.25rem;line-height:1.5}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--blue-light);color:var(--blue);margin-bottom:10px}
.std-pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--green-light);color:var(--green);margin-bottom:10px}
.eid-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 12px;border-radius:99px;background:var(--blue-light);color:var(--blue);border:1px solid var(--blue-mid);margin-bottom:14px}
label{font-size:13px;font-weight:600;color:var(--text);display:block;margin-bottom:5px}
.opt-label{font-weight:400;color:var(--text2);font-size:12px;margin-left:4px}
input[type=text],input[type=email],input[type=number],input[type=date],input[type=time],textarea{width:100%;padding:8px 10px;font-size:14px;border:1px solid var(--border-strong);border-radius:var(--r-md);background:var(--bg);color:var(--text);font-family:inherit;margin-bottom:14px;transition:border-color .15s}
input[type=file]{width:100%;padding:6px;font-size:13px;border:1px dashed var(--border-strong);border-radius:var(--r-md);background:var(--bg2);color:var(--text2);margin-bottom:14px;cursor:pointer}
input[type=file]:hover{border-color:var(--blue);background:var(--blue-light)}
input:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(24,95,165,.12)}
textarea{resize:vertical;min-height:65px}
.field{margin-bottom:14px}
.field label{margin-bottom:5px}
.field input,.field textarea{margin-bottom:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.radio-group{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.radio-btn{padding:7px 14px;font-size:13px;border-radius:99px;border:1px solid var(--border-strong);cursor:pointer;background:var(--bg2);color:var(--text2);transition:all .15s;user-select:none}
.radio-btn:hover{border-color:var(--blue);color:var(--blue)}
.radio-btn.sel{background:var(--blue);border-color:var(--blue);color:#fff}
.check-item{display:flex;align-items:center;gap:9px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--r-md);cursor:pointer;transition:background .15s;margin-bottom:6px}
.check-item:hover{background:var(--bg2)}
.check-item.sel{background:var(--blue-light);border-color:var(--blue-mid)}
.chk{width:17px;height:17px;border-radius:4px;border:1.5px solid var(--border-strong);flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.check-item.sel .chk{background:var(--blue);border-color:var(--blue)}
.chk svg{display:none}
.check-item.sel .chk svg{display:block}
.check-label{font-size:13px;color:var(--text)}
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);padding:1.1rem 1.25rem;margin-bottom:1rem;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card-title{font-size:15px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.func-group{margin-bottom:14px}
.func-group-label{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.warn-box{background:var(--amber-light);border-left:3px solid var(--amber);border-radius:0 var(--r-md) var(--r-md) 0;padding:9px 12px;font-size:13px;color:var(--amber-dark);margin-bottom:14px;line-height:1.5}
.danger-box{background:var(--red-light);border-left:3px solid var(--red);border-radius:0 var(--r-md) var(--r-md) 0;padding:9px 12px;font-size:13px;color:var(--red-dark);margin-bottom:14px;line-height:1.5}
.success-box{background:var(--green-light);border-left:3px solid #639922;border-radius:0 var(--r-md) var(--r-md) 0;padding:9px 12px;font-size:13px;color:var(--green);margin-bottom:14px;line-height:1.5}
.info-box{background:var(--blue-light);border-left:3px solid var(--blue);border-radius:0 var(--r-md) var(--r-md) 0;padding:9px 12px;font-size:13px;color:var(--blue-dark);margin-bottom:14px;line-height:1.5}
.sheet-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--blue);text-decoration:none;padding:6px 12px;border:1px solid var(--blue-mid);border-radius:var(--r-md);background:var(--blue-light);margin-bottom:10px;margin-right:8px;transition:background .15s}
.sheet-link:hover{background:var(--blue-mid)}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--border)}
.btn{padding:9px 22px;font-size:14px;border-radius:var(--r-md);border:1px solid var(--border-strong);cursor:pointer;font-family:inherit;transition:all .15s;font-weight:500;text-decoration:none;display:inline-block}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-dark)}
.btn-ghost{background:transparent;color:var(--text2)}
.btn-ghost:hover{background:var(--bg2)}
.btn-green{background:var(--green);border-color:var(--green);color:#fff}
.btn-green:hover{background:#27500A}
.btn-sm{padding:6px 14px;font-size:13px}
.prog{display:flex;gap:4px;margin-bottom:1.5rem}
.prog-dot{height:4px;flex:1;border-radius:99px;background:var(--border);transition:background .3s}
.prog-dot.done{background:var(--blue)}
.prog-dot.active{background:#378ADD}
.price-table{width:100%;font-size:13px;border-collapse:collapse;margin:10px 0}
.price-table td{padding:7px 8px;border-bottom:1px solid var(--border)}
.price-table td:last-child{text-align:right;font-weight:600}
.price-table tr.total-row td{border-bottom:none;font-weight:700;font-size:14px;border-top:2px solid var(--border-strong);padding-top:10px}
.email-preview{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-md);padding:12px;font-size:13px;color:var(--text);margin-bottom:10px;line-height:1.6;white-space:pre-wrap;word-break:break-word;max-height:260px;overflow-y:auto}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;margin-left:4px}
.tag-blue{background:var(--blue-light);color:var(--blue)}
.tag-amber{background:var(--amber-light);color:var(--amber-dark)}
.tag-red{background:var(--red-light);color:var(--red-dark)}
.tag-green{background:var(--green-light);color:var(--green)}
hr{border:none;border-top:1px solid var(--border);margin:12px 0}
.sub-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-md);padding:12px;margin-bottom:10px;position:relative}
.sub-card-label{font-size:11px;font-weight:600;color:var(--blue);margin-bottom:8px}
.sub-card-remove{position:absolute;top:10px;right:10px;font-size:12px;color:var(--text2);cursor:pointer;padding:2px 8px;border:1px solid var(--border);border-radius:99px;background:var(--bg)}
.sub-card-remove:hover{background:var(--red-light);color:var(--red-dark)}
.session-block{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 12px;margin-bottom:8px}
.session-hdr{display:flex;align-items:center;gap:9px;cursor:pointer}
.session-hdr.open{margin-bottom:10px}
.session-name{font-size:13px;font-weight:500;flex:1}
.session-dur{font-size:12px;color:var(--text2)}
.total-bar{background:var(--blue-light);border:1px solid var(--blue-mid);border-radius:var(--r-md);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.total-bar-label{font-size:13px;color:var(--blue-dark)}
.total-bar-val{font-size:15px;font-weight:600;color:var(--blue)}
.entry-wrap{padding:2rem 0 1rem}
.entry-logo{font-size:13px;font-weight:700;letter-spacing:.5px;color:var(--blue);text-transform:uppercase;margin-bottom:1.5rem}
.entry-title{font-size:24px;font-weight:700;margin-bottom:8px}
.entry-sub{font-size:14px;color:var(--text2);margin-bottom:2rem;line-height:1.6}
.path-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:1.5rem}
.path-card{border:1px solid var(--border-strong);border-radius:var(--r-lg);padding:1.5rem 1.25rem;cursor:pointer;transition:all .2s;background:var(--bg);text-align:left;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.path-card:hover{border-color:var(--blue);background:var(--blue-light);transform:translateY(-1px);box-shadow:0 4px 12px rgba(24,95,165,.15)}
.path-icon{font-size:28px;margin-bottom:10px}
.path-name{font-size:15px;font-weight:700;margin-bottom:4px}
.path-desc{font-size:12px;color:var(--text2);line-height:1.5}
@media(max-width:480px){.path-grid,.row2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="w"><div id="app"></div></div>
<script>
const ADMIN_EMAIL='admin@clevelandshrm.com';
const VENUE_SHEET='https://docs.google.com/spreadsheets/PLACEHOLDER_VENUE';
const SPONSOR_SHEET='https://docs.google.com/spreadsheets/PLACEHOLDER_SPONSORS';
const SESSION_ITEMS=['Check-in & networking','Program/presentation','Q&A','Other (optional)'];
const PDC_AREAS=[
  'HR Expertise','Interpersonal (Leadership & Navigation)','Interpersonal (Communication)',
  'Interpersonal (Global & Cultural Effectiveness)','Interpersonal (Relationship Management)',
  'Business (Business Acumen)','Business (Consultation)','Business (Critical Evaluation)','Business (Ethical Practice)'
];
const FUNC_AREAS={
  'People':['HR Strategy','Talent Acquisition','Employee Engagement & Retention','Learning & Development','Total Rewards'],
  'Organization':['Structure of the HR Function','Org. Effectiveness & Development','Workforce Management','Employee & Labor Relations','Technology Management'],
  'Workplace':['Managing a Global Workforce','Risk Management','Corporate Social Responsibility','U.S. Employment Law & Regulations']
};
const STEPS=9;

// ── STATE ─────────────────────────────────────────────────────────────────
let mode='',step=0;
let d={
  creatorName:'',creatorEmail:'',eventType:'',
  eventTitle:'',eventDate:'',timeMode:'',eventAmPm:'',startTime:'',endTime:'',
  programCalChecked:false,
  sessionBlocks:{},sessionHelpMode:false,totalDuration:'',
  venueName:'',venueAddress:'',venueParking:'',venuePrice:'',maxAttendees:'',
  offerPDC:'',pdcAreas:[],funcAreas:[],shrmBasket:false,
  hasFood:'',foodType:'',foodCostPer:'',caterWho:'',
  miscCosts:[],
  speakerType:'',spkName:'',spkEmail:'',spkCompany:'',spkTitle:'',spkFee:'',spkFeeAmt:'',
  spkPhotoFile:null,spkBioFile:null,panelists:[],
  shortDesc:'',fullDesc:'',learningObj:'',
  estimatedAttendance:'',
  hasSponsors:'',sponsors:[],
  // save the date
  stdName:'',stdEmail:'',stdTitle:'',stdSpeaker:'',stdDate:'',
  stdTimeMode:'',stdAmPm:'',stdStartTime:'',stdEndTime:'',
  stdType:'',stdLocKnown:null,stdLocName:'',stdLocAddr:'',
  stdCalChecked:false,stdDone:false
};
SESSION_ITEMS.forEach(s=>{d.sessionBlocks[s]={enabled:false,duration:''};});

// ── EVENT ID ──────────────────────────────────────────────────────────────
function makeId(title,date){
  const dp=date?date.replace(/-/g,''):'NODATE';
  const slug=(title||'EVENT').toUpperCase().replace(/[^A-Z0-9\s]/g,'').trim().split(/\s+/).slice(0,3).join('-');
  return`SHRM-${dp}-${slug}`;
}
function eid(){return makeId(d.eventTitle,d.eventDate);}
function sid(){return makeId(d.stdTitle,d.stdDate);}
function eidHdr(id){return`Event ID: ${id}\n${'─'.repeat(40)}\n`;}
function eidSubj(id,s){return`[${id}] ${s}`;}
function eidBadge(id){return`<div class="eid-badge">🔖 ${id}</div>`;}

// ── HELPERS ───────────────────────────────────────────────────────────────
const app=()=>document.getElementById('app');
function ck(){return`<svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4L3.5 6.5L9 1" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;}

// KEY FIX: use data attributes + event delegation so inputs don't re-render on every keystroke
function set(k,v){d[k]=v;}
function setAndRender(k,v){d[k]=v;render();}
function tog(k){d[k]=!d[k];render();}
function togArr(k,v){const i=d[k].indexOf(v);if(i>-1)d[k].splice(i,1);else d[k].push(v);render();}
function togSession(n){d.sessionBlocks[n].enabled=!d.sessionBlocks[n].enabled;render();}
function setSession(n,v){d.sessionBlocks[n].duration=v;updateTotal();}
function addPanelist(){if(d.panelists.length<6)d.panelists.push({name:'',email:'',company:'',title:'',photoFile:null,bioFile:null});render();}
function removePanelist(i){d.panelists.splice(i,1);render();}
function setPanelist(i,k,v){d.panelists[i][k]=v;}
function addSponsor(){d.sponsors.push({company:'',contactName:'',contactEmail:'',sponsoring:'',details:''});render();}
function removeSponsor(i){d.sponsors.splice(i,1);render();}
function setSponsor(i,k,v){d.sponsors[i][k]=v;}
function addMisc(){d.miscCosts.push({label:'',amount:''});render();}
function removeMisc(i){d.miscCosts.splice(i,1);render();}
function setMisc(i,k,v){d.miscCosts[i][k]=v;}

function totalMins(){if(d.sessionHelpMode)return parseInt(d.totalDuration)||0;let t=0;SESSION_ITEMS.forEach(s=>{const b=d.sessionBlocks[s];if(b.enabled)t+=parseInt(b.duration)||0;});return t;}
function minsToStr(m){if(!m||m<=0)return'—';const h=Math.floor(m/60),mn=m%60;return h>0?(mn>0?`${h}h ${mn}m`:`${h}h`):`${mn}m`;}
function updateTotal(){const el=document.getElementById('total-dur');if(el)el.textContent=minsToStr(totalMins());}
function fmt(n){return'$'+Math.round(n).toLocaleString();}
function fmt2(n){return'$'+(Math.round(n*100)/100).toFixed(2);}
function isVirtual(){return d.eventType==='Virtual';}
function within6Weeks(){if(!d.eventDate)return false;const now=new Date(),ev=new Date(d.eventDate),diff=(ev-now)/(1000*60*60*24);return diff>=0&&diff<42;}
function go(dir){step=Math.max(0,Math.min(STEPS-1,step+dir));render();scroll();}
function scroll(){document.querySelector('.w').scrollIntoView({behavior:'smooth'});}
function startMode(m){mode=m;step=0;render();scroll();}
function restart(){mode='';step=0;render();scroll();}
function prog(){return`<div class="prog">${Array.from({length:STEPS},(_,i)=>`<div class="prog-dot${i<step?' done':i===step?' active':''}"></div>`).join('')}</div>`;}
function eNav(nl){return`<div class="nav"><button class="btn btn-ghost" onclick="${step===0?'restart()':'go(-1)'}">${step===0?'Back to start':'Back'}</button><button class="btn btn-primary" onclick="go(1)">${nl||'Next'}</button></div>`;}
function mailto(to,subj,body){return`mailto:${to||''}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`;}

// ── STABLE INPUT HELPERS (no re-render on keystroke) ─────────────────────
// These render once; values are read from d[] at email-generation time.
// Only radio/checkbox selections call render().
function stableInp(k,ph,type,extra){
  type=type||'text';extra=extra||'';
  return`<input type="${type}" placeholder="${ph||''}" value="${(d[k]||'').toString().replace(/"/g,'&quot;')}" onchange="set('${k}',this.value)"${extra?' '+extra:''}>`;
}
function stableInpStd(k,ph,type){
  type=type||'text';
  return`<input type="${type}" placeholder="${ph||''}" value="${(d[k]||'').toString().replace(/"/g,'&quot;')}" onchange="set('${k}',this.value)">`;
}
function stableTa(k,ph){
  return`<textarea placeholder="${ph||''}" onchange="set('${k}',this.value)">${d[k]||''}</textarea>`;
}
function radioGroup(k,opts){
  return`<div class="radio-group">${opts.map(o=>`<div class="radio-btn${d[k]===o?' sel':''}" onclick="setAndRender('${k}','${o}')">${o}</div>`).join('')}</div>`;
}

// ── ENTRY ─────────────────────────────────────────────────────────────────
function renderEntry(){return`<div class="entry-wrap">
<div class="entry-logo">Cleveland SHRM</div>
<div class="entry-title">Event planning tool</div>
<div class="entry-sub">Your step-by-step guide for planning chapter events — from save the date to cost summaries and submission to Halle.</div>
<div class="path-grid">
  <div class="path-card" onclick="startMode('std')"><div class="path-icon">📅</div><div class="path-name">Save the date</div><div class="path-desc">Quick form — title, date, time, speaker, and location.</div></div>
  <div class="path-card" onclick="startMode('event')"><div class="path-icon">📋</div><div class="path-name">Full event planning</div><div class="path-desc">Plan a complete event — venue, speakers, food, costs, sponsors, and more.</div></div>
</div></div>`;}

// ── SAVE THE DATE ─────────────────────────────────────────────────────────
function renderStd(){
  if(d.stdDone)return stdDone();
  const isIP=d.stdType==='In-person';
  const curSid=sid();
  const showId=d.stdTitle&&d.stdDate;
  return`<div class="std-pill">Save the date</div>
<h2>Save the date details</h2>
<p class="sub">Fill in the details — a ready-to-send email will be generated.</p>
${showId?eidBadge(curSid):''}
<div class="card">
  <div class="field"><label>Your name</label>${stableInpStd('stdName','Jane Smith')}</div>
  <div class="field"><label>Your email</label>${stableInpStd('stdEmail','jane@clevelandshrm.org','email')}</div>
  <hr>
  <div class="field"><label>Event title</label><input type="text" placeholder="e.g. October Lunch & Learn" value="${(d.stdTitle||'').replace(/"/g,'&quot;')}" onchange="set('stdTitle',this.value)" oninput="set('stdTitle',this.value);document.getElementById('std-eid-badge').textContent='🔖 '+makeId(this.value,d.stdDate)"></div>
  <div class="field"><label>Speaker(s) <span class="opt-label">(optional)</span></label>${stableInpStd('stdSpeaker','e.g. Jane Smith, John Doe')}</div>
  <div class="field"><label>Event date</label><input type="date" value="${d.stdDate||''}" onchange="set('stdDate',this.value);document.getElementById('std-eid-badge').textContent='🔖 '+makeId(d.stdTitle,this.value)"></div>
  <hr>
  <div class="field"><label>Time</label></div>
  <div class="radio-group">
    <div class="radio-btn${d.stdTimeMode==='helper'?' sel':''}" onclick="setAndRender('stdTimeMode','helper')">Help me pick (AM / Midday / PM)</div>
    <div class="radio-btn${d.stdTimeMode==='specific'?' sel':''}" onclick="setAndRender('stdTimeMode','specific')">I know the exact times</div>
  </div>
  ${d.stdTimeMode==='helper'?`<div class="radio-group">${['AM','Midday','PM'].map(o=>`<div class="radio-btn${d.stdAmPm===o?' sel':''}" onclick="setAndRender('stdAmPm','${o}')">${o}</div>`).join('')}</div>`:''}
  ${d.stdTimeMode==='specific'?`<div class="row2"><div class="field"><label>Start time</label><input type="time" value="${d.stdStartTime||''}" onchange="set('stdStartTime',this.value)"></div><div class="field"><label>End time</label><input type="time" value="${d.stdEndTime||''}" onchange="set('stdEndTime',this.value)"></div></div>`:''}
  <hr>
  <div class="field"><label>Event type</label></div>
  <div class="radio-group">${['Virtual','In-person'].map(o=>`<div class="radio-btn${d.stdType===o?' sel':''}" onclick="setAndRender('stdType','${o}')">${o}</div>`).join('')}</div>
  ${isIP?`<hr>
  <div class="field"><label>Location</label></div>
  <div class="radio-group">
    <div class="radio-btn${d.stdLocKnown==='true'?' sel':''}" onclick="setAndRender('stdLocKnown','true')">Yes, I know it</div>
    <div class="radio-btn${d.stdLocKnown==='false'?' sel':''}" onclick="setAndRender('stdLocKnown','false')">I don't know yet</div>
  </div>
  ${d.stdLocKnown==='true'?`<div class="field"><label>Venue name</label>${stableInpStd('stdLocName','e.g. Huntington Convention Center')}</div>
  <div class="field"><label>Address <span class="opt-label">(optional)</span></label>${stableInpStd('stdLocAddr','123 Main St, Cleveland, OH')}</div>`:''}
  ${d.stdLocKnown==='false'?`<div class="info-box" style="margin-bottom:0">No problem — Halle will work with you on finding a venue. This will show as TBD in the save the date.</div>`:''}
  `:''}
  <hr>
  <div class="check-item${d.stdCalChecked?' sel':''}" onclick="tog('stdCalChecked')"><div class="chk">${ck()}</div><span class="check-label">Program calendar date has been checked for conflicts</span></div>
  ${!d.stdCalChecked?`<div class="warn-box" style="margin-top:10px">Please confirm the date is clear on the program calendar before proceeding.</div>`:''}
</div>
<div class="nav">
  <button class="btn btn-ghost" onclick="restart()">Back</button>
  <button class="btn btn-green" onclick="set('stdDone',true);render();scroll()">Generate save the date</button>
</div>
<div id="std-eid-badge" style="display:none">${showId?'🔖 '+curSid:''}</div>`;}

function stdDone(){
  const curSid=sid();
  const timeStr=d.stdTimeMode==='helper'?(d.stdAmPm||'TBD'):d.stdStartTime&&d.stdEndTime?(d.stdStartTime+' – '+d.stdEndTime):'TBD';
  const loc=d.stdType==='In-person'?(d.stdLocKnown==='true'?((d.stdLocName||'')+(d.stdLocAddr?', '+d.stdLocAddr:'')):'TBD — details to follow'):'';

function renderEvent(){const views=[eS0,eS1,eS2,eS3,eS4,eS5,eS6,eS7,eS8];return prog()+views[Math.min(step,8)]();}

function eS8(){
  const curEid=eid();
  const att=parseInt(d.estimatedAttendance)||0;

  const calcAtt=att||(maxAtt>0?Math.round(maxAtt*0.6):0);

  const venue=parseFloat(d.venuePrice)||0;
  const spkFee=d.spkFee==='Paid'?(parseFloat(d.spkFeeAmt)||0):0;
  const foodTotal=isVirtual()?0:food*calcAtt;
  const miscTotal=d.miscCosts.reduce((s,m)=>s+(parseFloat(m.amount)||0),0);
  const totalCost=foodTotal+venue+spkFee+miscTotal;
  const costPer=calcAtt>0?totalCost/calcAtt:0;
  const needsApproval=d.spkFee==='Paid'&&spkFee>=1000;
  const allSpeakers=[{name:d.spkName,email:d.spkEmail,title:d.spkTitle,company:d.spkCompany},...d.panelists.map(p=>({name:p.name,email:p.email,title:p.title,company:p.company}))].filter(s=>s.name);

  const bioSubj=eidSubj(curEid,`Bio & headshot request — ${d.eventTitle||'[Event Title]'}`);
  const bioBody=eidHdr(curEid)+`Hi [Speaker Name],\n\nThank you for agreeing to ${d.speakerType==='Panel'?'participate in the panel':'speak'} at our upcoming Cleveland SHRM event, "${d.eventTitle||'[Event Title]'}" on ${d.eventDate||'[Date]'}.\n\nCould you please send us:\n• A professional headshot (high resolution)\n• A brief bio (150-200 words)\n• Your title and company\n\nPlease reply by [DATE].\n\n${d.creatorName||'[Your Name]'}\nCleveland SHRM`;

  const approvalSubj=eidSubj(curEid,'Board approval needed — speaker fee');
  const approvalBody=eidHdr(curEid)+`Hi [Board Member],\n\nA speaker fee of ${fmt(spkFee)} has been entered for "${d.eventTitle||'[Event Title]'}" on ${d.eventDate||'[Date]'}.\n\nPer chapter policy, fees of $1,000 or more require board approval.\n\nOrganizer: ${d.creatorName||'[Name]'} (${d.creatorEmail||''})\nSpeaker: ${d.spkName||'[Name]'} — ${d.spkTitle||''} at ${d.spkCompany||''}\n\nPlease reply to approve.\n\nCleveland SHRM Event Planning Tool`;

  const miscSummary=d.miscCosts.filter(m=>m.label||m.amount).map(m=>`  ${m.label||'Misc'}: ${fmt(parseFloat(m.amount)||0)}`).join('\n');
  const summarySubj=eidSubj(curEid,`Event planning submission — ${d.eventTitle||'[Event Title]'}`);
  const summaryBody=eidHdr(curEid)+`Hi Halle,\n\nHere is a new event planning submission for your review.\n\n── EVENT DETAILS ──\nTitle: ${d.eventTitle||'—'}\nDate: ${d.eventDate||'—'}\nTime: ${timeStr}\nFormat: ${d.eventType||'—'}\nLocation: ${isVirtual()?'Zoom (virtual)':((d.venueName||'—')+', '+(d.venueAddress||''))}\nMax capacity: ${d.maxAttendees||'—'}\nPDCs offered: ${d.offerPDC==='Yes'?'Yes':'No'}${d.offerPDC==='Yes'?'\nLearning areas: '+d.pdcAreas.join(', '):''}\n${d.funcAreas.length>0?'Functional areas: '+d.funcAreas.join(', ')+'\n':''}\nFood: ${isVirtual()?'N/A (virtual)':(d.hasFood==='Yes'?(d.foodType||'Yes'):'No')}\n\n── SCHEDULE ──\n${sessionSummary}\nTotal: ${minsToStr(totalMins())}\n\n── SPEAKER ──\nFormat: ${d.speakerType||'—'}\nPrimary: ${d.spkName||'—'} (${d.spkTitle||''} at ${d.spkCompany||''})\nEmail: ${d.spkEmail||'—'}\nFee: ${d.spkFee==='Paid'?fmt(spkFee):'Free'}\n${d.panelists.length>0?'Panelists:\n'+d.panelists.map((p,i)=>`  ${i+1}. ${p.name||'—'} — ${p.title||''} at ${p.company||''} (${p.email||''})`).join('\n'):''}\n\n── COST SUMMARY ──\n${!isVirtual()&&d.hasFood==='Yes'?`Food (${fmt2(food)} x ${calcAtt} people): ${fmt(foodTotal)}\n`:''}${!isVirtual()&&venue>0?`Venue rental: ${fmt(venue)}\n`:''}${spkFee>0?`Speaker fee: ${fmt(spkFee)}\n`:''}${miscSummary?'Misc costs:\n'+miscSummary+'\n':''}Total estimated cost: ${fmt(totalCost)}\nAttendee estimate: ${calcAtt} (${att?'entered directly':'60% of '+maxAtt+' max capacity'})\nCost per person: ${calcAtt>0?fmt2(costPer):'—'}\n\n── SPONSORS ──\n${d.hasSponsors==='Yes'&&d.sponsors.length>0?d.sponsors.map(s=>`  ${s.company||'—'}: ${s.details||s.sponsoring||'—'} (${s.contactName||''} / ${s.contactEmail||''})`).join('\n'):(d.hasSponsors==='help'?'Sponsor help requested':'No sponsors')}\n\n── DESCRIPTIONS ──\nShort: ${d.shortDesc||'—'}\nLearning objectives:\n${d.learningObj||'—'}\n\nSubmitted by: ${d.creatorName||'—'} (${d.creatorEmail||'—'})\nCleveland SHRM Event Planning Tool`;

  const sponsorHelpSubj=eidSubj(curEid,'Sponsor help needed');
  const sponsorHelpBody=eidHdr(curEid)+`Hi,\n\nThe organizer of "${d.eventTitle||'[Event Title]'}" on ${d.eventDate||'[Date]'} is looking for sponsor assistance.\n\nOrganizer: ${d.creatorName||'[Name]'} (${d.creatorEmail||'[Email]'})\n\nThis will be noted in the event summary sent to Halle.\n\nCleveland SHRM Event Planning Tool`;

  return`<div class="pill">Step 9 of 9 — Summary</div>
<h2>Event summary</h2>
<p class="sub">Review your cost breakdown, generate your emails, and submit to Halle.</p>
${eidBadge(curEid)}
<div class="info-box">Every email below includes the Event ID <strong>${curEid}</strong> so all correspondence can be easily tracked together.</div>

${needsApproval?`<div class="danger-box">⚠️ Board approval required — speaker fee of ${fmt(spkFee)} exceeds $1,000. Send the approval email below before confirming with the speaker.</div>`:''}

<div class="card">
  <div class="card-title">Cost summary</div>
  <div class="field"><label>Estimated attendance <span class="tag tag-amber">optional — overrides 60% of max</span></label>${stableInp('estimatedAttendance','Leave blank to use 60% of max capacity','number','min="1"')}</div>
  ${calcAtt>0?`<table class="price-table">
    ${!isVirtual()&&venue>0?`<tr><td>Venue rental</td><td>${fmt(venue)}</td></tr>`:''}
    ${!isVirtual()&&d.hasFood==='Yes'?`<tr><td>Food (${fmt2(food)} × ${calcAtt} people)</td><td>${fmt(foodTotal)}</td></tr>`:''}
    ${spkFee>0?`<tr><td>Speaker fee</td><td>${fmt(spkFee)}</td></tr>`:''}
    ${d.miscCosts.filter(m=>m.label||m.amount).map(m=>`<tr><td>${m.label||'Misc'}</td><td>${fmt(parseFloat(m.amount)||0)}</td></tr>`).join('')}

    <tr><td style="color:var(--text2)">Cost per person</td><td>${fmt2(costPer)}</td></tr>
  </table>
  <p class="sub" style="margin-top:8px">Based on ${att?'your entered estimate of '+att:Math.round(maxAtt*0.6)+' (60% of '+maxAtt+' max)'}. Halle will work with you on final pricing.</p>`
  :`<div class="info-box" style="margin-bottom:0">Enter max attendees in Step 4 or an estimate above to see cost calculations.</div>`}
</div>

<div class="card">
  <div class="card-title">Sponsors</div>
  <div class="radio-group">
    <div class="radio-btn${d.hasSponsors==='Yes'?' sel':''}" onclick="setAndRender('hasSponsors','Yes')">Yes</div>
    <div class="radio-btn${d.hasSponsors==='No'?' sel':''}" onclick="setAndRender('hasSponsors','No')">No</div>
    <div class="radio-btn${d.hasSponsors==='help'?' sel':''}" onclick="setAndRender('hasSponsors','help');window.open('${SPONSOR_SHEET}','_blank')">Please help find one</div>
  </div>
  ${d.hasSponsors==='Yes'?`${d.sponsors.map((sp,i)=>`<div class="sub-card">
    <div class="sub-card-label">Sponsor ${i+1}</div>
    <span class="sub-card-remove" onclick="removeSponsor(${i})">Remove</span>
    <div class="row2"><div class="field"><label>Company</label><input type="text" placeholder="Acme Corp" value="${(sp.company||'').replace(/"/g,'&quot;')}" onchange="setSponsor(${i},'company',this.value)"></div><div class="field"><label>Contact name</label><input type="text" placeholder="Contact" value="${(sp.contactName||'').replace(/"/g,'&quot;')}" onchange="setSponsor(${i},'contactName',this.value)"></div></div>
    <div class="field"><label>Details (pricing, what they're sponsoring — e.g. space, food)</label><input type="text" placeholder="e.g. Sponsoring food, $500 contribution" value="${(sp.details||'').replace(/"/g,'&quot;')}" onchange="setSponsor(${i},'details',this.value)"></div>
    <div class="field"><label>Contact email</label><input type="email" placeholder="contact@co.com" value="${(sp.contactEmail||'').replace(/"/g,'&quot;')}" onchange="setSponsor(${i},'contactEmail',this.value)"></div>
  </div>`).join('')}
  <button class="btn btn-ghost btn-sm" onclick="addSponsor()" style="margin-bottom:4px">+ Add sponsor</button>`:''}
  ${d.hasSponsors==='help'?`<div class="info-box" style="margin-top:8px;margin-bottom:0">The sponsor resource sheet has been opened in a new tab. Halle will see "sponsor help requested" in your submission and reach out to assist.</div>`:''}
</div>

${d.spkName?`<div class="card">
  <div class="card-title">Bio &amp; photo request <span class="tag tag-blue">Send to speaker(s)</span></div>
  <div class="email-preview">${bioBody}</div>
  <a class="btn btn-ghost btn-sm" href="${mailto(allSpeakers.map(s=>s.email).filter(Boolean).join(','),bioSubj,bioBody)}">Open bio request email</a>
</div>`:''}

${needsApproval?`<div class="card">
  <div class="card-title">Board approval <span class="tag tag-red">Required</span></div>
  <div class="email-preview">${approvalBody}</div>
  <a class="btn btn-ghost btn-sm" href="${mailto('',approvalSubj,approvalBody)}">Open approval email</a>
</div>`:''}

<div class="card">
  <div class="card-title">Submit to Halle <span class="tag tag-green">Final step</span></div>
  <p class="sub" style="margin-bottom:12px">Clicking below opens an email pre-addressed to <strong>admin@clevelandshrm.com</strong> with all of your event details. Just hit send!</p>
  <div class="email-preview">${summaryBody}</div>
  <a class="btn btn-primary" href="${mailto(ADMIN_EMAIL,summarySubj,summaryBody)}">Open &amp; send to Halle</a>
</div>

<div class="nav"><button class="btn btn-ghost" onclick="go(-1)">Back</button><button class="btn btn-primary" onclick="restart()">Plan a new event</button></div>`;}

function render(){
  if(!mode){app().innerHTML=renderEntry();return;}
  if(mode==='std'){app().innerHTML=renderStd();return;}
  app().innerHTML=renderEvent();
}
render();
</script>
</body>
</html>
